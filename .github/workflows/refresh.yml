name: Refresh offers

on:
  push:                       # app changes go live in ~1 min (republishes current offers, no re-collecting)
    branches: [main]
    paths-ignore: [".last-refresh", "README.md", "feedback.json"]
  schedule:
    - cron: "0 3 * * *"      # every day at 06:00 Bahrain time
  workflow_dispatch:          # the app's Refresh button and ✓/✗ checks (or "Run workflow" on GitHub)
    inputs:
      sources:
        description: "What to refresh"
        type: choice
        default: "news,instagram,talabat"
        options:
          - "news,instagram,talabat"    # full, ~20 min
          - "news,instagram"            # quick, ~3 min
          - "none"                      # just save your ✓/✗ checks and republish, ~1 min
      feedback:
        description: "Your checks from the app (JSON, sent by the app)"
        type: string
        default: ""

permissions:
  contents: write     # saves feedback.json + the monthly keep-alive commit
  pages: write        # publish the site
  id-token: write     # required by GitHub Pages

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      # Starts from what's live on the site (so offers and Instagram finds carry over), saves any
      # ✓/✗ checks sent from the app, collects new offers, drops expired and wrong ones.
      - name: Collect offers
        id: collect
        continue-on-error: true
        env:
          FEEDBACK: ${{ inputs.feedback }}      # passed as data, never pasted into the shell
          SOURCES: ${{ github.event_name == 'push' && 'none' || inputs.sources || 'news,instagram,talabat' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python refresh.py --sources "$SOURCES"

      # Your checks live in the repo so every future refresh respects them
      - name: Save your checks
        run: |
          if [ -n "$(git status --porcelain feedback.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feedback.json
            git commit -m "Save offer checks from the app"
            git pull --rebase -q && git push
          fi

      # Publish even if a source failed: expired offers still need removing, other sources still update
      - uses: actions/upload-pages-artifact@v3
        if: steps.collect.outcome == 'success' || github.event_name != 'push'
        with:
          path: web

      - id: deploy
        if: steps.collect.outcome == 'success' || github.event_name != 'push'
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled jobs in public repos after 60 days without a commit.
      # A tiny commit every ~25 days keeps the daily refresh running forever.
      - name: Keep the daily schedule alive
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt 2160000 ]; then
            date -u +%FT%TZ > .last-refresh
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .last-refresh
            git commit -m "Keep daily refresh active"
            git pull --rebase -q && git push
          fi

      # Mark the run failed (GitHub emails you) when Talabat couldn't be refreshed
      - name: Flag failed refresh
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Talabat refresh failed — see the 'Collect offers' step. Old offers expire within a day."
          exit 1
